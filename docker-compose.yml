services:
  postgres:
    image: postgres:16
    container_name: nll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nll
      POSTGRES_PASSWORD: nll
      POSTGRES_DB: neon_led_love
    ports:
      - "5432:5432"
    volumes:
      - nll_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nll -d neon_led_love"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nll_pg:
